<!doctype html>
<html lang="zh-CN" class="dark scheme-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080d17" />
    <meta name="description" content="从 Tokenizer 到生成：通过交互动画、数学公式与逐步计算，系统学习经典 Transformer。" />
    <title>Transformer Atlas · 可视化学习手册</title>
    <script>
      try {
        const theme = localStorage.getItem('transformer-atlas-theme')
        if (theme === 'light') {
          document.documentElement.classList.remove('dark', 'scheme-dark')
          document.documentElement.classList.add('scheme-light')
        }
      } catch (_) {}
    </script>
    <script>
      window.MathJax = {
        tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
        svg: { fontCache: 'local' },
        startup: { typeset: false },
      }
    </script>
    <script src="/vendor/mathjax/tex-svg.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
